spec:
  current_version: 0.3.2
  differentiation: Compiles stable data, entry, query, presentation and policy contracts into WordPress and Elementor without exposing PHP, SQL, raw keys or selector maps in the normal workflow.
  implemented_capabilities:
    - CPT definitions with Elementor-aware fields
    - table-backed CCT definitions and Elementor listings
    - legacy DOM and CCT filter providers
    - native CPT media selection with URL preservation
  portfolio_role: infrastructure-product
  problem: General WordPress implementations become fragile when schema, forms, queries, filters and Elementor bindings are configured independently through raw technical identifiers.
  repository_path: products/elementor-implementation-toolkit/repository
  roadmap_claims:
    - executable Blueprint compiler
    - frontend Entry Surfaces and policy workflows
    - canonical Collections and derived Filter Surfaces
    - typed Elementor bridge and WooCommerce adapter
    - per-Blueprint migration, diagnostics and rollback
  signal: A visual compiler that turns implementation intent into governed WordPress and Elementor runtime contracts.
  status: active
  summary: Dogfood-first implementation toolkit evolving from verified V0.3.2 primitives into the executable Blueprint 1.0 architecture.
  target_user: No-code Elementor implementers who build reusable client systems; client editors operate content through generated frontend surfaces.
  thesis: Put complexity in compiled contracts, migrations and diagnostics so sophisticated WordPress systems remain small and intuitive to implement.
  title: Elementor Implementation Toolkit
  wordpress_mount: wordpress/wp-content/plugins/elementor-implementation-toolkit
