spec:
  decision: LinkedIn is an official career and acquisition channel for launching international job applications, tracking role sources, follow-ups, evidence bundles and application outcomes.
  rationale: Guilherme will apply to roles through LinkedIn, so Studio OS must treat LinkedIn activity as real pipeline input instead of informal context.
  reconsideration_trigger: Revisit if another channel becomes the primary source of qualified international WordPress opportunities.
  status: active
  summary: Adds LinkedIn to the operational career pipeline without inventing applications.
  title: LinkedIn career channel
