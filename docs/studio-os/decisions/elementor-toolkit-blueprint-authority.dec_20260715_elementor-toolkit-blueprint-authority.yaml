spec:
  decision: The eit.dev/v1 executable Blueprint is the canonical authority for Elementor Implementation Toolkit system behavior. It replaces the V0.2 conceptual canvas, CPT/CCT product separation and widget-first filter authority. Collection owns query behavior; Entry Surface owns workflow semantics; Elementor owns presentation.
  rationale: The previous model exposed implementation details, distributed authority across widgets and definitions, and encouraged manual bindings that do not scale into a reliable no-code system. A compiled contract preserves stable identities, migration safety, diagnostics and a smaller implementation surface.
  reconsideration_trigger: Reconsider only if dogfood proves that an executable Blueprint cannot express a required general implementation without raw keys or code, or if the compilation boundary creates measured regressions that adapters cannot contain.
  status: active
  summary: Establishes Blueprint as the executable product authority and formally supersedes incompatible V0.2 and widget-first preconizations.
  title: Elementor Toolkit Blueprint authority
