spec:
  claims:
    - The CLI test suite now checks every command in the semantic Studio command registry against a dry-run JSON CLI fallback case.
    - CLI runtime returns stable ResultEnvelope output for pre-command validation failures such as invalid expected revision input.
    - Idempotency replay returns the same entity result and conflicting key reuse is classified as conflict with exit code 6.
    - Expected revision success, stale revision conflict and invalid revision input are covered.
    - The work does not add external sends, real customer records or portfolio implementation.
  command: >-
    npm run verify &&
    npm run test -- packages/cli/src/index.test.ts packages/core/src/command-service.test.ts packages/core/src/idempotency.test.ts &&
    npm run studio -- validate --json &&
    npm run studio -- sync --rebuild --verify --json &&
    git diff --check
