    - Fixed admin URL sanitization so safe query-string admin paths such as `edit.php?post_type=elementor_library` are accepted.
  command: >-
    docker compose run --rm wpcli gp area list --format=json;
    docker compose run --rm wpcli gp area-item list <area> --format=json;
    docker compose run --rm wpcli gp area-item links 632 mina-form-home --format=json;
    docker compose run --rm wpcli gp area-item links 631 elementor-library --format=json
