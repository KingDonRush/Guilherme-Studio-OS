  checksum: 0981a44b1494e595074a476e8905acef959638264a60e557a5fc84354b213916
  claims:
    - Portfolio Workbench defaults to `context=root`, so the portfolio front page can be inspected and configured without first creating a project.
    - Root context supports option-backed items, relations, suggestions, settings, frontpage state and code-created page definitions.
    - Project contexts keep project-backed storage and support local `blog_index` attachments without mutating WordPress `page_for_posts`.
    - Admin render smokes pass with configured and missing frontpage states, and no legacy project creation gate is rendered.
    - WP-CLI exposes root topology, frontpage controls, context item/relation/suggestion commands and coded page materialization.
    - Temporary pages, project posts and root Workbench records were removed after verification.
  command: >-
    docker compose run --rm wpcli --skip-plugins=elementor,pro-elements
    gp topology root / gp code-page materialize / gp item create-page /
    gp suggestion mark / gp frontpage / wp eval admin render smoke
