spec:
  claims:
    - Infrastructure schema V6 installs and verifies 18 dedicated tables, adding durable storage identity claims and pending-upload lifecycle state to immutable Blueprints, artifacts, bindings, change sets, locks, runs, reconciliation, rollback, normalized relations and multivalues, Entry idempotency and actions, migrations, ordered events and QA scenarios; activation still performs no content migration.
    - Blueprint publication is checksum- and confirmation-bound, revalidated under locks, activates immutable versions through compare-and-swap and can safely resume the same interrupted applying change set with the same token without duplicating runtime artifacts.
    - Durable CPT/CCT storage claims survive an interrupted apply, reject foreign or ambiguous ownership before storage exists, permit recovery only by the exact owning Blueprint and change contract and preserve prepared claims for reconciliation when a later transaction fails.
    - Publication remains fail-closed when a field or storage change needs destructive copy, transform, count/checksum validation and switch semantics that the current migration engine cannot prove.
    - Entry Surfaces preserve an existing item's status during autosave, reconcile pending uploads without orphan promotion, validate relation targets and ownership server-side, resolve relation labels without N+1 behavior, support repeaters and conditions and no longer expose an unimplemented notification action; supported core actions are redirect, email and webhook.
    - Collection runtime derives provider requirements from compiled Field Contract capabilities, applies typed exact filters, stores CPT multichoice values as repeated exact meta rows, compiles CCT multichoice facets without substring matching, projects taxonomies publicly as id/name/slug/url objects through batched term resolution and exposes Explain Why only when explicitly requested.
    - Collection and Entry authorization remains server-owned; browser-supplied IDs do not grant capability, ownership or object scope and Collection responses are reduced to the allowed projection.
    - Legacy inventory remains read-only until explicit selection, checksum-bound confirmation and draft creation; source drift, active imported systems and locally edited drafts fail closed.
    - The five dogfood pilots remain CPT __imoveis with one record, CCT projects with six records and Elementor documents 301, 340 and 479 as unpublished Blueprint drafts; Elementor revisions remain backup evidence rather than active usage.
    - Real-estate, clinic, delivery and ecommerce sufficiency fixtures validate and compile through the same primitive grammar without PHP, SQL, raw meta keys, selectors or domain-specific Blueprint code.
    - Concrete Impact Maps resolve exact pages, templates, Toolkit widgets, fields, records, adapters and revision backup counts without substring matching or treating visual position as semantics; Flight Recorder data is bounded and redacted and the QA Scenario Runner invalidates stale passing evidence.
    - Mechanical browser verification produced /tmp/eit-v100rc-connector-surfaces.png at 782x564 with SHA-256 a98fd6bbd9790b81c8be53c3c9d225da7af2654ec32fe5aedc7af91368d01007 and /tmp/eit-v100rc-connector-editor.png at 1280x720 with SHA-256 5e7af0e6849342a37493125a1845001232fd52b30f70105d26352531db3ddd9f.
