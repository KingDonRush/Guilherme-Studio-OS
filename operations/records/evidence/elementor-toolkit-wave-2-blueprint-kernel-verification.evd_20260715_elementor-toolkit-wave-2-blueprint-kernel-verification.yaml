spec:
  claims:
    - The canonical eit.dev/v1 Blueprint validates stable UUIDs, four executable lanes, typed connections, orphan references, dependency cycles, single-owner cardinality and unambiguous storage bindings.
    - Twenty-seven semantic Field primitives compile complete validation, exposure, storage, indexing, form component, Elementor and query capability contracts.
    - Versioned SDK registries expose field primitives, storage adapters, Collection providers, form actions and presentation adapters with semantic versions and health checks.
    - The compiler deterministically emits Entity, storage, capability, field, relation, entry, Collection, filter, presentation, route, policy and adapter artifacts plus stable Field ID bindings and legacy aliases.
    - Publication follows draft, validation, impact preparation, explicit confirmation, apply and reconciliation with expiring locks, redacted runs and immutable version and artifact records.
    - Published storage key changes fail closed until a copy, transform, count and checksum migration can be reconciled.
    - Rollback reactivates prior artifacts without deleting later versions or data, and normalized relation and repeatable-group records remain queryable child structures.
    - Active compiled CPT and CCT definitions project into runtime without being written into legacy options, and legacy managers reject mutation of Blueprint-owned definitions.
    - Legacy CPT, CCT and filter preset import is deterministic, compilable and read-only in shadow mode; plugin activation installs infrastructure and never migrates content.
    - The V0.5 branch contains exactly three functional commits and the local annotated v0.5.0 tag resolves to c2030a5c9e9030543cd10dddb2dba439f4926b25.
    - Composer validation, PHP syntax, WPCS and PHPCompatibility, PHPStan, PHPUnit, WordPress integration, Vitest, Playwright with axe, strict line budget, Gitleaks and Git whitespace checks pass.
    - Deterministic Git evidence patches were generated at /tmp/git-evidence.patch and /tmp/git-evidence-range.patch against v0.4.0.
  command: >-
    composer validate --strict &&
    composer lint &&
    composer phpcs &&
    composer analyse &&
    composer test &&
    npm run build &&
    npm test &&
    npm run check:js &&
    composer test:wp &&
    npm run test:e2e &&
    php scripts/verify-line-budget.php --strict &&
    gitleaks git --redact --no-banner --exit-code 1 &&
    git diff --check
