  claims:
    - "`gp_project` no longer exposes its standalone wp-admin UI or Appearance submenu; it remains internal storage for the Workbench."
    - Portfolio Workbench renders project creation and project settings forms inside the Workbench instead of linking to the legacy post editor.
    - Content list project links now open the selected project context in Portfolio Workbench.
    - Admin render smoke rejects legacy `post-new.php?post_type=gp_project`, `Edit project` and `New project` links.
  command: >-
    docker compose -f wordpress/docker-compose.yml -f operations/wordpress/docker-compose.products.yml run --rm wpcli --skip-plugins=elementor,pro-elements
    eval Workbench create-project action, gp_project show_ui check, and no-legacy admin render smoke
