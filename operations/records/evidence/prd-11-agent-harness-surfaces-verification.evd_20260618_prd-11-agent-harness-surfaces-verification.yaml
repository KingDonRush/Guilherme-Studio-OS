spec:
  claims:
    - Agent Harness surfaces are shared from core instead of being reinterpreted independently by API, MCP or panel.
    - Local API AgentRun endpoints expose context pack and handoff details as read-only envelopes.
    - MCP exposes agent harness resources and read tools for governed agent continuation.
    - MCP prompts cover the PRD 11 normative workflow prompt set without mutating state by themselves.
    - Panel Agents view consumes the local API AgentRun report and presents runs, context packs, handoffs and gaps.
    - Focused API test covers AgentRun creation through the command runtime followed by read-only surface inspection.
    - Affected core, local API, MCP and panel workspaces build.
  command: >-
    npm run test -- packages/local-api/src/index.test.ts &&
    npm run build -w @guilherme-studio/core &&
    npm run build -w @guilherme-studio/local-api &&
    npm run build -w @guilherme-studio/mcp &&
    npm run build -w @guilherme-studio/panel &&
    npm run studio -- validate --json &&
    npm run studio -- sync --rebuild --verify --json &&
    npm run verify &&
    git diff --check
