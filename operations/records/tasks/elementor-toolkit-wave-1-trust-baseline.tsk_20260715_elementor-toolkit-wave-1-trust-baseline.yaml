spec:
  acceptance:
    - CCT schema changes are atomic, checked and indexed for declared filter and sort capabilities
    - unpublished CCT rows cannot leak through public rendering
    - published slugs and storage keys cannot change without an explicit migration plan
    - field validation accepts the string zero, rejects duplicates and reserved keys, and preserves input after failure
    - Collection REST enforces body, filter, page-size and computed-cost budgets
    - DOM legacy is capped at 200 items, tokenizes exactly and performs no enrichment N+1
    - concurrent frontend requests abort stale work and only the latest response mutates state
    - loading, error, focus, live-region and reduced-motion behavior passes keyboard and axe checks
    - ghost controls are removed or backed by proven behavior and Toolkit assets use no more than four requests when all surfaces are present
    - files above the blocking line budget are modularized before receiving new responsibilities
