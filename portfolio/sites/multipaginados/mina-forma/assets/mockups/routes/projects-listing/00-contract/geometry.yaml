  - intro
  - filter_row
  - final_cta
image_max_boxes:
  featured_case: 870x405
  project_grid_image: 410x270
content_that_must_not_grow_parent:
  - intro contains no image
  - filter labels stay on one controlled row at desktop
  - project images crop inside assigned spans
  - project captions do not determine image height
  - the project index must not push the CTA below the canvas
responsive_recomposition:
  tablet: feature becomes two bands and project images use a two-column ordered grid
  mobile: filters wrap; feature and all projects become one semantic vertical list; image precedes attached caption and action
