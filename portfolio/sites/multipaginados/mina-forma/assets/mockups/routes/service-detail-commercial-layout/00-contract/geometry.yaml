fixed_height_regions:
  - header
  - masthead
  - final_cta
image_max_boxes:
  plan_image: 900x430
  deliverable_primary: 560x300
  deliverable_secondary: 400x210
  applied_case_interior: 760x360
content_that_must_not_grow_parent:
  - masthead imagery is forbidden
  - plan image must crop inside its assigned box
  - deliverable images must not define section height
  - applied-case image must not push the CTA downward
responsive_recomposition:
  tablet: two-column regions become two bands while section order remains unchanged
  mobile: title, copy and action stack; callouts precede plan; process becomes a vertical sequence; images use width 100 percent and explicit aspect ratios
